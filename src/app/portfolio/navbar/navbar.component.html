<nav class="professional-navbar">
    <div class="navbar-container">
      <div class="logo-section">
        <img src="assets/logo3.png" alt="Brand Logo" class="logo" />
        <span class="brand-name">PortFolio </span>
      </div>
  
      <div class="menu-wrapper" [class.active]="isMenuOpen">
        <ul class="navigation-links">
          <li *ngFor="let item of navItems" (click)="navigateTo(item.href.replace('#', ''))">
            <fa-icon [icon]="item.icon" class="nav-icon"></fa-icon>
            <span>{{ item.label }}</span>
          </li>
        </ul>
      </div>
  
      <div class="action-section">
        <!-- <button class="cta-button">Hire Me</button> -->
  
        <div class="mobile-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  
    <div class="mobile-menu-overlay" *ngIf="isMenuOpen">
        <!-- <button class="mobile-menu-close" (click)="closeMenu()">
            <span></span>
            <span></span>
          </button> -->
      <div class="mobile-menu-content">
        <ul>
          <li
            *ngFor="let item of navItems"
            class="mobile-nav-item"
            (click)="navigateTo(item.href.replace('#', ''))"
          >
            <fa-icon [icon]="item.icon"></fa-icon>
            {{ item.label }}
          </li>
        </ul>
        <!-- <button class="mobile-cta-button">Hire Me</button> -->
      </div>
      <button class="mobile-menu-close" (click)="closeMenu()">
        <i class="fa-solid fa-xmark"></i>

      </button>
    </div>
  </nav>
